name: release

# Build Cortex installers on a `v*` / `cortex-v*` tag. The three build jobs only
# upload workflow artifacts; a single release job then publishes all assets at
# once (avoids concurrent create-release races between Windows and both macOS
# jobs). `workflow_dispatch` runs the builds but skips publishing (no tag).
on:
  push:
    tags:
      - 'v*'
      - 'cortex-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Mirrors: the build machines are often behind the GFW.
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  # macOS builds are unsigned (electron-builder.yml: identity: null).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  cleanup:
    name: Remove obsolete releases
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete v2.0.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v2.0.0 --repo "${{ github.repository }}" --yes --cleanup-tag || true

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-windows-x64
          path: release/Cortex-*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron + CLI + MCP bundles
        run: npm run build

      - name: Build macOS runtime
        run: node scripts/build-runtime.mjs --platform darwin --arch ${{ matrix.arch }}

      - name: Build dmg
        run: npx electron-builder --mac dmg --arch ${{ matrix.arch }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-macos-${{ matrix.arch }}
          path: release/Cortex-*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cortex-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/Cortex-*
          fail_on_unmatched_files: true
