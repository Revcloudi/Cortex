name: release

# Build the Windows installer on a `v*` / `cortex-v*` tag. The build job only
# uploads a workflow artifact; the release job then publishes the single
# installer to GitHub Releases. macOS/Linux are CLI-only and install from source
# (see README), so no macOS artifacts are produced.
on:
  push:
    tags:
      - 'v*'
      - 'cortex-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Mirrors: the build machines are often behind the GFW.
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  cleanup:
    name: Remove obsolete releases
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete v2.0.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v2.0.0 --repo "${{ github.repository }}" --yes --cleanup-tag || true

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-windows-x64
          path: release/Cortex-*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cortex-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Delete the previous release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/Cortex-*
          fail_on_unmatched_files: true
