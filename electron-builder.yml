# electron-builder configuration — Cortex.
#
# Windows (per-user NSIS): %LOCALAPPDATA%\Programs\Cortex
#
#   Cortex.exe                    Electron shell (asar)
#   resources/app.asar            main / preload / renderer bundles + prod deps
#   resources/app.asar.unpacked/  better-sqlite3 native module (Electron side)
#   bin/                          self-contained agent runtime (extraFiles)
#     node.exe  mcp-stdio.cjs  ctx.cjs  ctx.cmd  ctx-path.cjs
#     skills/{zh,en}/*.skill.md
#     node_modules/better-sqlite3  (Node-API, shared with the Electron build)
#
# Only Windows desktop artifacts are released; macOS/Linux are CLI-only and
# install from source (see README).
#
# The database lives outside the app: %USERPROFILE%\.cortex\data.db
# (~/.cortex/data.db on macOS/Linux CLI), so uninstalling never touches it.
appId: com.cortex.app
productName: Cortex
copyright: Copyright © 2026 Cortex
# better-sqlite3 v13 is Node-API (NAPI 10) based: the same prebuilt .node is
# ABI-compatible with Electron AND with the bundled Node runtime, so no
# electron-rebuild / node-gyp toolchain is required (and indeed none is
# installed on build machines). Disable electron-builder's native rebuild.
npmRebuild: false
# extraFiles cannot carry node_modules (electron-builder appends
# !**/node_modules/**), so the hook restores runtime/node_modules into bin/ and
# verifies the bundled node can load the native addon.
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # better-sqlite3 ships full C++ sources + every platform prebuild (~26 MB);
  # only lib/, package.json and the target prebuilds are needed at runtime.
  # Keep win32-x64 + both darwin prebuilds so the same config also works for
  # the macOS CI build; Linux/Windows-arm64 builds are not produced.
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/build/**'
  - '!node_modules/better-sqlite3/prebuilds/linux-*.node'
  - '!node_modules/better-sqlite3/prebuilds/linuxmusl-*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  # node-addon-api is a build-time dependency of better-sqlite3.
  - '!node_modules/node-addon-api/**'
# Ship only the two UI languages instead of all 55 Chromium locale packs
# (saves ~46 MB unpacked; Electron falls back to en-US).
electronLanguages:
  - en-US
  - zh-CN
# NSIS/LZMA maximum compression: slower packaging, smaller installer.
compression: maximum
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
extraFiles:
  # extraFiles (not extraResources) on purpose: the agent runtime must be
  # <install>/bin (the CLI, installer and documented agent configs all point
  # there), not resources/bin.
  - from: runtime
    to: bin
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Cortex-${version}-setup.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  shortcutName: Cortex
  uninstallDisplayName: Cortex
  menuCategory: false
